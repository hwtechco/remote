<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>远程控制</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: system-ui, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f7fa;
        }
        .container {
            background: #fff;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 16px 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            overflow: auto;
        }
        .item {
            margin-bottom: 12px;
            flex-shrink: 0;
        }
        /* 连接栏：u + p1 + p2 + token + 按钮 */
        .conn-bar {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .conn-bar #wsUrl {
            flex: 1 1 auto;
            min-width: 0;
        }
        .conn-bar .port-input {
            width: 110px;
            flex: 0 0 auto;
        }
        .conn-bar #wsToken {
            width: 150px;
            flex: 0 0 auto;
        }
        /* 连接按钮不参与压缩，避免文字被挤成两行 */
        .conn-bar #connectBtn {
            flex: 0 0 auto;
            white-space: nowrap;
        }
        /* 主布局：PC 端左 2/3 画面 + 右 1/3 控制区 */
        .main-layout {
            display: flex;
            gap: 16px;
            align-items: stretch;
            margin-bottom: 12px;
        }
        .main-layout .item {
            margin-bottom: 0;
        }
        .screen-column {
            flex: 3;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }
        .control-column {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        /* 屏幕画面区域：宽度占满，高度按 16:9 比例 */
        .screen-item {
            display: flex;
            flex-direction: column;
        }
        .screen-item label {
            flex-shrink: 0;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            font-size: 14px;
        }
        button {
            padding: 9px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        #connectBtn {
            background-color: #1677ff;
            color: white;
        }
        #connectBtn.disconnect {
            background-color: #f5222d;
        }
        /* 操作小按钮 */
        .shortcut-bar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            padding-bottom: 4px;
        }
        .shortcut-btn {
            padding: 4px 12px;
            font-size: 12px;
            background-color: #f0f2f5;
            color: #333;
            border: 1px solid #d0d7de;
            border-radius: 5px;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .shortcut-btn:hover {
            background-color: #e2e6ec;
        }
        .shortcut-btn:disabled {
            background-color: #e6e8eb;
            color: #999;
            cursor: not-allowed;
        }
        /* 图片显示区域 */
        #screenArea {
            width: 100%;
            aspect-ratio: 16 / 9;
            border: 2px dashed #d0d7de;
            border-radius: 8px;
            background-color: #fafafa;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            padding: 0;
        }
        #screenArea img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }
        #screenPointCanvas {
            position: absolute;
            pointer-events: none;
            z-index: 2;
        }
        #screenPlaceholder {
            color: #888;
            font-size: 14px;
            padding: 40px 0;
            text-align: center;
            line-height: 1.8;
        }
        /* 虚拟键盘（仅样式，暂无逻辑） */
        .keyboard {
            width: 100%;
            background: #e9ecf1;
            border: 1px solid #d0d7de;
            border-radius: 8px;
            padding: 10px;
            user-select: none;
        }
        .kb-row {
            display: flex;
            gap: 6px;
            margin-bottom: 6px;
        }
        .kb-row:last-child {
            margin-bottom: 0;
        }
        .kb-key {
            flex: 1 1 0;
            height: 40px;
            border: 1px solid #b6bcc6;
            border-radius: 5px;
            background: linear-gradient(#ffffff, #eceef2);
            font-size: 13px;
            color: #333;
            cursor: pointer;
            padding: 0;
            box-shadow: 0 1px 1px rgba(0,0,0,0.15);
        }
        .kb-key:hover {
            background: linear-gradient(#ffffff, #dfe3e9);
        }
        .kb-key:active {
            background: #cfd4dc;
        }
        /* 切换键按下状态（Alt 等） */
        .kb-key.kb-pressed {
            background: #c9d0da;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.25);
            color: #111;
        }
        /* 宽键按真实键盘比例（单位数） */
        .kb-w-15 { flex-grow: 1.5; }
        .kb-w-175 { flex-grow: 1.75; }
        .kb-w-2 { flex-grow: 2; }
        .kb-w-225 { flex-grow: 2.25; }
        .kb-w-275 { flex-grow: 2.75; }
        .kb-w-6 { flex-grow: 6; }
        .kb-rows { font-size: 12px; }
        /* 各行起始缩进，模拟真实键盘键位错开 */
        .kb-row.r2 { padding-left: 0; }
        .kb-row.r3 { padding-left: 0; }
        .kb-row.r4 { padding-left: 0; }
        .kb-row.r5 { padding-left: 0; }
        /* 功能键行 */
        .kb-fn-row {
            margin-bottom: 8px;
        }
        .kb-fn-row .kb-key {
            height: 34px;
            font-size: 12px;
        }
        .kb-fn-gap {
            flex: 0.5 1 0;
        }
        #statusBar {
            font-size: 13px;
            color: #888;
            margin-top: 10px;
            min-height: 18px;
            flex-shrink: 0;
        }
        /* ---------- 配置页：任务 × 账号 勾选矩阵（对照 dialog.py） ---------- */
        .page-overlay {
            position: fixed;
            inset: 0;
            z-index: 60;
            display: flex;
            justify-content: center;
            align-items: stretch;
            background: #f5f7fa;
            padding: 16px;
        }
        .page-overlay[hidden] {
            display: none;
        }
        .works-dialog {
            width: min(1180px, 100%);
            display: flex;
            flex-direction: column;
            background: #fff;
            border: 1px solid #d0d7de;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            overflow: hidden;
        }
        .works-grid-wrap {
            flex: 1;
            overflow: auto;
        }
        .works-table {
            border-collapse: collapse;
            width: 100%;
            font-size: 13px;
        }
        .works-table th,
        .works-table td {
            border-bottom: 1px solid #eceff2;
            padding: 6px 10px;
            text-align: center;
            white-space: nowrap;
        }
        .works-table th {
            position: sticky;
            top: 0;
            z-index: 2;
            background: #f7f9fb;
            font-weight: 500;
            color: #333;
        }
        .works-table th.task-col,
        .works-table td.task-col {
            position: sticky;
            left: 0;
            z-index: 1;
            min-width: 132px;
            text-align: left;
            background: #fff;
        }
        .works-table th.task-col {
            z-index: 3;
            background: #f7f9fb;
        }
        .works-table td.task-col {
            color: #444;
        }
        .works-table tr.special td {
            background: #fbfcfd;
            font-size: 12px;
            color: #666;
        }
        .works-table tr.special td.task-col {
            background: #fbfcfd;
        }
        .works-table input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        .works-table .col-head .tag {
            font-weight: 600;
        }
        .works-table .col-head .record {
            margin-top: 2px;
            font-size: 11px;
            font-weight: 400;
            color: #999;
        }
        .works-footer {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-top: 1px solid #e6e9ee;
        }
        .works-status {
            flex: 1;
            min-height: 16px;
            font-size: 12px;
            color: #888;
        }
        .works-status.error {
            color: #f5222d;
        }
        .works-actions {
            display: flex;
            gap: 8px;
        }
        .page-btn {
            padding: 6px 14px;
            font-size: 13px;
            background: #fff;
            color: #333;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            cursor: pointer;
        }
        .page-btn:hover {
            background: #f0f2f5;
        }
        .page-btn.primary {
            background: #1677ff;
            border-color: #1677ff;
            color: #fff;
        }
        .page-btn.primary:hover {
            background: #0958d9;
        }
        .page-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        /* 移动端适配 */
        @media (max-width: 760px) {
            .container {
                padding: 10px 10px 16px;
                overflow-y: auto;
            }
            /* 移动端恢复上下单栏布局：画面在上，控制区在下 */
            .main-layout {
                flex-direction: column;
                gap: 0;
                margin-bottom: 0;
            }
            .main-layout .item {
                margin-bottom: 10px;
            }
            /* 画面到状态栏：收窄（原本 10+10 叠出了 20px 空档） */
            .main-layout .screen-item {
                margin-bottom: 4px;
            }
            .control-column {
                gap: 0;
            }
            .item {
                margin-bottom: 10px;
            }
            input[type="text"] {
                font-size: 16px;
                padding: 8px 10px;
            }
            /* 连接栏在窄屏换行：u 独占一行，端口/Token 等分剩余宽度 */
            .conn-bar {
                flex-wrap: wrap;
            }
            .conn-bar #wsUrl {
                flex: 1 1 100%;
            }
            .conn-bar .port-input,
            .conn-bar #wsToken {
                flex: 1 1 0;
                width: auto;
                min-width: 0;
            }
            .shortcut-bar {
                gap: 6px;
            }
            .shortcut-btn {
                padding: 6px 10px;
                font-size: 12px;
            }
            .keyboard {
                padding: 6px;
                border-radius: 6px;
            }
            .kb-row {
                gap: 3px;
                margin-bottom: 4px;
            }
            .kb-key {
                height: 30px;
                font-size: 11px;
                border-radius: 4px;
            }
            .kb-fn-row {
                margin-bottom: 5px;
            }
            .kb-fn-row .kb-key {
                height: 26px;
                font-size: 10px;
            }
            /* 状态栏：贴近上方画面，与下方按钮拉开 */
            #statusBar {
                font-size: 12px;
                margin: 4px 0 14px;
            }
            .page-overlay {
                padding: 8px;
            }
            .works-dialog {
                border-radius: 6px;
            }
            .works-table th,
            .works-table td {
                padding: 5px 8px;
            }
            .works-table th.task-col,
            .works-table td.task-col {
                min-width: 108px;
            }
            .works-footer {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="item">
        <div class="conn-bar">
            <input autocomplete="off" id="wsUrl" placeholder="WebSocket 地址（如 ws://192.168.1.5）" type="text">
            <input autocomplete="off" class="port-input" id="p1Input" inputmode="numeric" placeholder="主控端口" type="text">
            <input autocomplete="off" class="port-input" id="p2Input" inputmode="numeric" placeholder="抓帧端口" type="text">
            <input autocomplete="off" id="wsToken" placeholder="Token" type="text">
            <button id="connectBtn">连接</button>
        </div>
    </div>

    <!-- 主布局：PC 端左 2/3 画面 + 右 1/3 控制区 -->
    <div class="main-layout">

        <div class="screen-column">
            <!-- 屏幕显示区域 -->
            <div class="item screen-item">
                <div id="screenArea">
                    <div id="screenPlaceholder">屏幕画面</div>
                    <canvas id="screenPointCanvas"></canvas>

        </div>

        <!-- 右侧：操作按钮 + 键盘 -->
        <div class="control-column">

            <div id="statusBar">未连接</div>

            <!-- 操作按钮 -->
            <div class="item">
                <div class="shortcut-bar">
                    <button class="shortcut-btn" id="refreshBtn" disabled>刷新</button>

                    <button class="shortcut-btn" data-command="start" disabled>开始</button>
                    <button class="shortcut-btn" data-command="stop" disabled>停止</button>
                    <button class="shortcut-btn" data-command="shutdown" disabled>关机</button>

    </div>

    <div class="item">

            <div class="kb-row kb-fn-row">
                <button class="kb-key" data-key="esc">Esc</button>

<!-- 配置页：任务 × 账号 勾选矩阵（对照 xy2/dialog.py） -->
<div id="worksPage" class="page-overlay" hidden>
    <div class="works-dialog">
        <div class="works-grid-wrap">
            <table id="worksTable" class="works-table"></table>
        </div>
        <div class="works-footer">
            <div id="worksStatus" class="works-status"></div>
            <div class="works-actions">
                <button class="page-btn" id="worksCloseBtn">关闭</button>
                <button class="page-btn" id="worksReloadBtn">重新读取</button>
                <button class="page-btn primary" id="worksSaveBtn">保存</button>
            </div>
        </div>
    </div>
</div>

<script>
    let ws = null;        // 主控连接（键鼠/任务）
    let wsCapture = null; // 抓帧连接（capture 端口）
    let seq = 0;          // 请求自增 id
    let lastSeq = 0;      // 最近一次渲染的抓帧序号（服务端异步下发的帧用它丢弃过期帧）
    let authed = false;   // 主控连接是否通过鉴权
    let capAuthed = false; // 抓帧连接是否通过鉴权
    let authTimer = null;
    const wsUrlInput = document.getElementById('wsUrl');
    const p1Input = document.getElementById('p1Input');
    const p2Input = document.getElementById('p2Input');
    const wsToken = document.getElementById('wsToken');
    const connectBtn = document.getElementById('connectBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const addMainPointBtn = document.getElementById('addMainPointBtn');
    const statusBar = document.getElementById('statusBar');
    const worksBtn = document.getElementById('worksBtn');

    // 把 ws 地址拆成 协议/主机/端口/路径，便于按 p1/p2 拼出两个端口地址
    function splitWs(url){
        let u = (url || '').trim();
        if(!u){ return {scheme:'ws://', host:'', port:null, path:''}; }
        if(!/^wss?:\/\//.test(u)){ u = 'ws://' + u; } // 手填裸地址时补协议
        const m = /^(wss?:\/\/)([^/:]+)(?::(\d+))?(\/.*)?$/.exec(u);
        if(!m){ return {scheme:'ws://', host:'', port:null, path:''}; }
        return {scheme:m[1], host:m[2], port:m[3] ? Number(m[3]) : null, path:m[4] || ''};
    }
    function joinWs(parts, port){
        if(!parts.host){ return ''; }
        return parts.scheme + parts.host + (port ? ':' + port : '') + parts.path;
    }

    // 服务端地址格式：u=ws://ip&p1=9527&p2=9394&t=xxx
    // 页面把 u 当主机，p1 / p2 分别填主控与抓帧端口
    (function(){
        const params = new URLSearchParams(location.search);
        const u = (params.get('u') || '').trim();
        const token = params.get('t');
        if(token){ wsToken.value = token.trim(); }
        if(!u){ return; }
        wsUrlInput.value = u; // u 原样保留（可能自带端口）
        const parts = splitWs(u);
        p1Input.value = params.get('p1') || (parts.port ? String(parts.port) : '');
        p2Input.value = params.get('p2') || '';
    })();

    // 主控地址 = u + p1（p1 为空时用 u 里自带的端口）
    function commandUrl(){
        const parts = splitWs(wsUrlInput.value);
        const port = parseInt(p1Input.value, 10) || parts.port;
        return joinWs(parts, port);
    }

    // 抓帧地址 = u + p2
    function captureUrl(){
        const parts = splitWs(wsUrlInput.value);
        const port = parseInt(p2Input.value, 10);
        return port ? joinWs(parts, port) : '';
    }

    // 图片显示区域
    const screenArea = document.getElementById('screenArea');
    const screenPlaceholder = document.getElementById('screenPlaceholder');
    const screenPointCanvas = document.getElementById('screenPointCanvas');
    const mainCtx = screenPointCanvas.getContext('2d');
    const clearMainPointsBtn = document.getElementById('clearMainPointsBtn');
    const confirmMainPointsBtn = document.getElementById('confirmMainPointsBtn');
    const confirmMainPointsRightBtn = document.getElementById('confirmMainPointsRightBtn');
    const dragMainPointsBtn = document.getElementById('dragMainPointsBtn');
    const dragMainPointsRightBtn = document.getElementById('dragMainPointsRightBtn');
    const moveMainPointsBtn = document.getElementById('moveMainPointsBtn');
    const scrollUpBtn = document.getElementById('scrollUpBtn');
    const scrollDownBtn = document.getElementById('scrollDownBtn');
    let mainImg = null;

    // 选点状态
    let currentImageBlobUrl = null;
    let pointList = []; // {x:像素X,y:像素Y} —— 始终是真实桌面像素
    // 服务端下发的原始桌面尺寸（预览图可能被缩小，坐标必须以它为准）
    let screenW = 0;
    let screenH = 0;

    // 坐标基准：优先用服务端给的原始尺寸，没有才退回图片自身尺寸
    function imgSize(){
        const w = screenW || (mainImg ? mainImg.naturalWidth : 0);
        const h = screenH || (mainImg ? mainImg.naturalHeight : 0);
        return {w: w, h: h};
    }

    function setStatus(text){
        statusBar.innerText = text;
    }

    // 将收到的截图显示到主图片区域
    function showScreenImage(blob){
        const url = URL.createObjectURL(blob);
        if(currentImageBlobUrl){
            URL.revokeObjectURL(currentImageBlobUrl);
        }
        currentImageBlobUrl = url;
        screenPlaceholder.style.display = 'none';
        let img = screenArea.querySelector('img');
        if(!img){
            img = document.createElement('img');
            screenArea.appendChild(img);
        }
        mainImg = img;
        img.src = url;
        img.onload = ()=>{
            positionMainCanvas();
        };
        // 拖动画面微调最近一个选点（属性赋值避免重复绑定）
        img.onpointerdown = onPointerDown;
        img.onpointermove = onPointerMove;
        img.onpointerup = onPointerUp;
        img.onpointercancel = onPointerCancel;
    }

    // 计算 object-fit:contain 时图片在盒内的实际显示区域
    function containRect(boxW, boxH, imgW, imgH){
        const scale = Math.min(boxW / imgW, boxH / imgH);
        const w = imgW * scale;
        const h = imgH * scale;
        return {
            x: (boxW - w) / 2,
            y: (boxH - h) / 2,
            w: w,
            h: h
        };
    }

    // 让选点画布覆盖图片的实际显示区域（对齐 contain 后的图片位置）
    function positionMainCanvas(){
        if(!mainImg) return;
        const size = imgSize();
        if(!size.w || !size.h) return;
        const imgRect = mainImg.getBoundingClientRect();
        const areaRect = screenArea.getBoundingClientRect();
        const c = containRect(imgRect.width, imgRect.height, size.w, size.h);
        screenPointCanvas.style.left = (imgRect.left - areaRect.left + c.x) + 'px';
        screenPointCanvas.style.top = (imgRect.top - areaRect.top + c.y) + 'px';
        screenPointCanvas.style.width = c.w + 'px';
        screenPointCanvas.style.height = c.h + 'px';
        screenPointCanvas.width = size.w;
        screenPointCanvas.height = size.h;
        renderMainPoints();
    }

    // 窗口尺寸变化时重算画布位置（画面区域高度随视口变化）
    window.addEventListener('resize', ()=>{
        positionMainCanvas();
    });

    // 将指针位置换算为图像原始像素坐标；落在 contain 留白外则返回 null
    function pointFromPointer(e){
        if(!mainImg) return null;
        const size = imgSize();
        if(!size.w || !size.h) return null;
        const rect = mainImg.getBoundingClientRect();
        const c = containRect(rect.width, rect.height, size.w, size.h);
        const x = e.clientX - rect.left - c.x;
        const y = e.clientY - rect.top - c.y;
        if(x < 0 || y < 0 || x > c.w || y > c.h) return null;
        return {
            x: Math.round(x * size.w / c.w),
            y: Math.round(y * size.h / c.h)
        };
    }

    // 将指针位置换算为图像原始像素坐标（不判断边界，供拖动增量计算）
    function pointerPosRaw(e){
        if(!mainImg) return null;
        const size = imgSize();
        if(!size.w || !size.h) return null;
        const rect = mainImg.getBoundingClientRect();
        const c = containRect(rect.width, rect.height, size.w, size.h);
        return {
            x: Math.round((e.clientX - rect.left - c.x) * size.w / c.w),
            y: Math.round((e.clientY - rect.top - c.y) * size.h / c.h)
        };
    }

    // ---- 拖动微调最近一个选点：按下记录起点，按相对位移移动最后一个选点 ----
    let dragState = null; // {startX, startY, pointX, pointY}

    function onPointerDown(e){
        if(!mainImg || pointList.length === 0) return;
        e.preventDefault();
        const p = pointerPosRaw(e);
        if(!p) return;
        const last = pointList[pointList.length - 1];
        dragState = { startX: p.x, startY: p.y, pointX: last.x, pointY: last.y };
        try{ mainImg.setPointerCapture(e.pointerId); }catch(_){}
    }

    function onPointerMove(e){
        if(!dragState) return;
        const p = pointerPosRaw(e);
        if(!p) return;
        const last = pointList[pointList.length - 1];
        const maxX = Math.max(0, screenPointCanvas.width - 1);
        const maxY = Math.max(0, screenPointCanvas.height - 1);
        last.x = Math.max(0, Math.min(maxX, dragState.pointX + (p.x - dragState.startX)));
        last.y = Math.max(0, Math.min(maxY, dragState.pointY + (p.y - dragState.startY)));
        renderMainPoints();
    }

    function onPointerUp(){
        dragState = null;
    }

    function onPointerCancel(){
        dragState = null;
    }

    // 在主图画布上绘制选点
    function renderMainPoints(){
        mainCtx.clearRect(0,0,screenPointCanvas.width,screenPointCanvas.height);
        mainCtx.fillStyle = "#ff3333";
        mainCtx.strokeStyle = "#fff";
        mainCtx.lineWidth = 2;
        for(const p of pointList){
            mainCtx.beginPath();
            mainCtx.arc(p.x,p.y,6,0,Math.PI*2);
            mainCtx.fill();
            mainCtx.stroke();
        }
    }

    function setPointButtonsEnabled(en){
        clearMainPointsBtn.disabled = !en;
        confirmMainPointsBtn.disabled = !en;
        confirmMainPointsRightBtn.disabled = !en;
        dragMainPointsBtn.disabled = !en;
        dragMainPointsRightBtn.disabled = !en;
        moveMainPointsBtn.disabled = !en;
    }

    // 控制"操作类"按钮（刷新画面 / 开始停止关机）的启停
    function setActionButtonsEnabled(en){
        refreshBtn.disabled = !en;
        addMainPointBtn.disabled = !en;
        worksBtn.disabled = !en;
        document.querySelectorAll('.shortcut-btn[data-command]').forEach((b)=> b.disabled = !en);
        scrollUpBtn.disabled = !en;
        scrollDownBtn.disabled = !en;
    }

    // 断开连接后恢复画面区域的初始状态（占位提示 + 清空选点）
    function resetScreen(){
        if(currentImageBlobUrl){
            URL.revokeObjectURL(currentImageBlobUrl);
            currentImageBlobUrl = null;
        }
        mainImg = null;
        pointList = [];
        dragState = null;
        const img = screenArea.querySelector('img');
        if(img) img.remove();
        mainCtx.clearRect(0,0,screenPointCanvas.width,screenPointCanvas.height);
        screenPlaceholder.style.display = '';
        setPointButtonsEnabled(false);
    }

    // ================== 新协议（JSON-RPC）相关 ==================

    // 发送一次 RPC 请求（fire-and-forget）：capture 走抓帧连接，其余走主控连接
    function rpc(method, params){
        if(!authed){ return false; }
        ws.send(JSON.stringify({id: ++seq, method: method, params: params || {}}));
        return true;
    }

    // 抓帧请求单独走采集连接；服务端立即回执、帧异步下发
    function requestCapture(params){
        if(!(wsCapture && capAuthed)){ return false; }
        wsCapture.send(JSON.stringify({id: ++seq, method: 'capture', params: params || {}}));
        return true;
    }

    // 采集连接：鉴权后与主控连接并行工作，互不阻塞
    function openCapture(){
        const url = captureUrl();
        if(!url){
            setStatus('⚠️ 未填写抓帧端口 p2');
            return;
        }
        capAuthed = false;
        lastSeq = 0; // 服务端 seq 按连接自增，重连后从 1 重新开始
        wsCapture = new WebSocket(url);
        wsCapture.binaryType = 'arraybuffer';
        wsCapture.onopen = ()=>{
            wsCapture.send(JSON.stringify({type:'auth', token: wsToken.value.trim()}));
        };
        wsCapture.onmessage = (evt)=>{
            if(evt.data instanceof ArrayBuffer){
                const f = decodeFrame(evt.data);
                if(f) handleServerMessage(f.head, f.payloads);
                return;
            }
            try{
                const obj = JSON.parse(evt.data);
                if(obj.type === 'auth_ok'){
                    capAuthed = true;
                    setStatus('✅ 抓帧连接就绪');
                    requestCapture();
                    return;
                }
                handleServerMessage(obj, []);
            }catch(e){
                setStatus('收到消息：' + evt.data);
            }
        };
        wsCapture.onerror = ()=>{ capAuthed = false; };
        wsCapture.onclose = (e)=>{
            capAuthed = false;
            wsCapture = null;
            if(authed){
                setStatus('⚠️ 抓帧连接断开 code:' + e.code);
            }
        };
    }

    function closeCapture(){
        capAuthed = false;
        if(wsCapture){ try{ wsCapture.close(); }catch(_){} }
        wsCapture = null;
    }

    // 带响应的 RPC：服务端回 ok=true 时 resolve(result)，ok=false 或超时 reject
    const pendingRpc = new Map(); // id -> {resolve, reject, timer}
    function rpcAwait(method, params, timeoutMs){
        if(!authed){ return Promise.reject(new Error('未连接')); }
        const id = ++seq;
        return new Promise((resolve, reject)=>{
            const timer = setTimeout(()=>{
                if(pendingRpc.delete(id)){
                    reject(new Error('请求超时'));
                }
            }, timeoutMs || 3000);
            pendingRpc.set(id, {resolve: resolve, reject: reject, timer: timer});
            ws.send(JSON.stringify({id: id, method: method, params: params || {}}));
        });
    }

    // 结束一条挂起的 RPC；ok=false 时 payload 作为错误信息
    function settleRpc(id, ok, payload){
        const entry = pendingRpc.get(id);
        if(!entry){ return false; }
        pendingRpc.delete(id);
        clearTimeout(entry.timer);
        if(ok){
            entry.resolve(payload);
        }else{
            entry.reject(new Error(payload || '命令失败'));
        }
        return true;
    }

    // 解码二进制帧：head(JSON,含 payloads 长度) + \n + 各 payload 二进制
    function decodeFrame(buf){
        const bytes = new Uint8Array(buf);
        const sep = bytes.indexOf(0x0A); // 找 \n 分隔符
        if(sep < 0) return null;
        let head;
        try{
            head = JSON.parse(new TextDecoder().decode(bytes.subarray(0, sep)));
        }catch(e){
            return null;
        }
        const payloads = [];
        const body = buf.slice(sep + 1);
        const pl = head.payloads || [];
        let off = 0;
        for(const p of pl){
            payloads.push(body.slice(off, off + p.length));
            off += p.length;
        }
        return {head: head, payloads: payloads};
    }

    // 处理服务端下行消息（文本 JSON 或二进制帧）
    // 服务端协议：{id, ok, msg, result}；抓帧帧头额外带 seq 与 payloads
    function handleServerMessage(obj, payloads){
        if(obj.type === 'auth_ok'){
            authed = true;
            clearTimeout(authTimer);
            setStatus('✅ 鉴权成功，WebSocket 就绪');
            setActionButtonsEnabled(true);
            openCapture(); // 主控就绪后再连采集端口，抓一帧
            return;
        }
        // 抓帧成功：二进制帧（result.fmt=jpeg + payload）
        if(obj.result && obj.result.fmt === 'jpeg' && payloads.length > 0){
            if(obj.seq !== undefined){
                if(obj.seq <= lastSeq){ return; } // 晚到的过期帧直接丢弃
                lastSeq = obj.seq;
            }
            // 记录原始桌面尺寸：预览图可能被服务端缩小，坐标换算要用它
            if(obj.result.width && obj.result.height){
                screenW = obj.result.width;
                screenH = obj.result.height;
            }
            showScreenImage(new Blob([payloads[0]], {type:'image/jpeg'}));
            setStatus('画面已更新');
            refreshBtn.disabled = false;
            return;
        }
        // 抓帧受理：帧稍后下发
        if(obj.ok === true && obj.msg === 'pending'){
            setStatus('抓帧中...');
            return;
        }
        // 被更新的抓帧请求合并掉：静默忽略，不当作错误
        if(obj.ok === false && obj.msg === 'merged'){
            return;
        }
        // 失败回执（命令执行失败 / 抓帧失败 / 未知方法 / 参数错误）
        if(obj.ok === false){
            const msg = obj.msg !== undefined ? obj.msg : '未知错误';
            if(obj.id !== undefined){ settleRpc(obj.id, false, msg); }
            setStatus('❌ ' + msg);
            return;
        }
        // 带响应的 RPC（如 mouse_position / load_works / save_works）：id 命中后交回 Promise
        if(obj.id !== undefined && pendingRpc.has(obj.id)){
            settleRpc(obj.id, true, obj.result);
            return;
        }
        // 其它命令的普通回执
        if(obj.id !== undefined){
            setStatus('命令已发送 (id=' + obj.id + ')');
        }
    }

    // ================== 命令发送（旧文本命令 → 新 RPC） ==================

    // 左键点击：依次移动到每个点并单击
    function sendPointCommands(){
        if(pointList.length === 0){
            alert('还没有选点');
            return;
        }
        if(!authed){ alert('未完成连接'); return; }
        for(const p of pointList){
            rpc('mouse_move_to', {x:p.x, y:p.y});
            rpc('mouse_left_click');
        }
        captureDelayed(); // 操作后延迟刷新画面
        setStatus('已发送点击命令：' + pointList.length + ' 个点');
        pointList = [];
        renderMainPoints();
        setPointButtonsEnabled(false);
    }

    // 右键点击：与左键一致，仅左键换右键
    function sendPointRightCommands(){
        if(pointList.length === 0){
            alert('还没有选点');
            return;
        }
        if(!authed){ alert('未完成连接'); return; }
        for(const p of pointList){
            rpc('mouse_move_to', {x:p.x, y:p.y});
            rpc('mouse_right_click');
        }
        captureDelayed();
        setStatus('已发送右键点击命令：' + pointList.length + ' 个点');
        pointList = [];
        renderMainPoints();
        setPointButtonsEnabled(false);
    }

    // 左键拖动：起点按下，沿后续点移动，终点松开
    function sendPointDragCommands(){
        if(pointList.length < 2){
            alert('拖动至少需要 2 个点（起点和终点）');
            return;
        }
        if(!authed){ alert('未完成连接'); return; }
        rpc('mouse_move_to', {x:pointList[0].x, y:pointList[0].y});
        rpc('mouse_left_press');
        for(let i = 1; i < pointList.length; i++){
            rpc('mouse_move_to', {x:pointList[i].x, y:pointList[i].y});
        }
        rpc('mouse_left_release');
        captureDelayed();
        setStatus('已发送左键拖动命令：' + pointList.length + ' 个点');
        pointList = [];
        renderMainPoints();
        setPointButtonsEnabled(false);
    }

    // 右键拖动：与左键一致，仅左键换右键
    function sendPointRightDragCommands(){
        if(pointList.length < 2){
            alert('拖动至少需要 2 个点（起点和终点）');
            return;
        }
        if(!authed){ alert('未完成连接'); return; }
        rpc('mouse_move_to', {x:pointList[0].x, y:pointList[0].y});
        rpc('mouse_right_press');
        for(let i = 1; i < pointList.length; i++){
            rpc('mouse_move_to', {x:pointList[i].x, y:pointList[i].y});
        }
        rpc('mouse_right_release');
        captureDelayed();
        setStatus('已发送右键拖动命令：' + pointList.length + ' 个点');
        pointList = [];
        renderMainPoints();
        setPointButtonsEnabled(false);
    }

    // 清除选点
    function clearPoints(){
        pointList = [];
        renderMainPoints();
        setPointButtonsEnabled(false);
    }

    // 鼠标移动：与左键点击一致，仅依次移动到每个点、不点击
    function sendPointMoveCommands(){
        if(pointList.length === 0){
            alert('还没有选点');
            return;
        }
        if(!authed){ alert('未完成连接'); return; }
        for(const p of pointList){
            rpc('mouse_move_to', {x:p.x, y:p.y});
        }
        captureDelayed(); // 操作后延迟刷新画面
        setStatus('已发送鼠标移动命令：' + pointList.length + ' 个点');
        pointList = [];
        renderMainPoints();
        setPointButtonsEnabled(false);
    }

    clearMainPointsBtn.onclick = clearPoints;
    confirmMainPointsBtn.onclick = sendPointCommands;
    confirmMainPointsRightBtn.onclick = sendPointRightCommands;
    dragMainPointsBtn.onclick = sendPointDragCommands;
    dragMainPointsRightBtn.onclick = sendPointRightDragCommands;
    moveMainPointsBtn.onclick = sendPointMoveCommands;

    // 增加选点：调用 mouse_position 获取当前鼠标位置并标记红点
    async function addPoint(){
        if(!authed){ alert('未完成连接'); return; }
        setStatus('正在获取鼠标位置...');
        try{
            const result = await rpcAwait('mouse_position', {});
            const x = Math.round(result.x);
            const y = Math.round(result.y);
            pointList.push({x: x, y: y});
            renderMainPoints();
            setPointButtonsEnabled(true);
            setStatus('已增加选点：' + pointList.length + ' (' + x + ',' + y + ')');
        }catch(err){
            setStatus('❌ 获取鼠标位置失败: ' + err.message);
        }
    }
    addMainPointBtn.addEventListener('click', addPoint);

    // 向上 / 向下滚动：发送 mouse_scroll_up / mouse_scroll_down
    scrollUpBtn.addEventListener('click', ()=>{
        if(!authed){ alert('未完成连接'); return; }
        rpc('mouse_scroll_up', {steps: 24});
        setStatus('已发送 mouse_scroll_up');
        captureDelayed();
    });
    scrollDownBtn.addEventListener('click', ()=>{
        if(!authed){ alert('未完成连接'); return; }
        rpc('mouse_scroll_down', {steps: 24});
        setStatus('已发送 mouse_scroll_down');
        captureDelayed();
    });

    // 开始/停止/关机：直接调用同名 RPC（start / stop / shutdown）
    document.querySelectorAll('.shortcut-btn[data-command]').forEach((b)=>{
        b.addEventListener('click',()=>{
            const method = b.dataset.command;
            if(!authed){ alert('未完成连接'); return; }
            // 关机属高风险操作，需二次确认避免误点
            if(method === 'shutdown' && !confirm('确定要执行关机吗？')){
                return;
            }
            rpc(method);
            setStatus('已发送 ' + method);
        });
    });

    // 延迟 1 秒后发送截图命令（除鉴权成功外的所有截图场景统一走此入口）
    // 1 秒内再次触发时，取消上一次的延迟任务，只保留最后一次（防抖）
    let captureTimer = null;
    function captureDelayed(){
        if(captureTimer){
            clearTimeout(captureTimer);
        }
        captureTimer = setTimeout(()=>{
            captureTimer = null;
            if(authed){ requestCapture(); }
        }, 1000);
    }

    // 发送截图命令（刷新画面按钮，即时发送，不做延迟）
    function sendCapture(){
        if(!authed){ alert('未完成连接'); return; }
        if(!requestCapture()){
            setStatus('抓帧连接未就绪');
            return;
        }
        setStatus('已发送 capture');
    }

    // 当前处于按下状态的切换键数量（决定普通键是否额外发送 Capture）
    let togglePressedCount = 0;

    // 虚拟键盘按键：点击发送 keyboard_write <键值>（排除 toggle 切换键）
    document.querySelectorAll('.keyboard .kb-key[data-key]:not(.kb-toggle)').forEach((k)=>{
        k.addEventListener('click',()=>{
            const key = k.dataset.key;
            if(!authed){ alert('未完成连接'); return; }
            rpc('keyboard_write', {key:key});
            setStatus('已发送 keyboard_write ' + key);
            // 无切换键按下时才刷新画面；组合键（如 Alt+E）按下期间不额外截图
            if(togglePressedCount === 0){
                captureDelayed();
            }
        });
    });

    // 虚拟键盘切换键（Alt/Ctrl/Shift）：点击按下/松开，发送 keyboard_press/release <键值>
    document.querySelectorAll('.keyboard .kb-toggle').forEach((k)=>{
        let pressed = false;
        k.addEventListener('click',()=>{
            if(!authed){ alert('未完成连接'); return; }
            const key = k.dataset.key;
            pressed = !pressed;
            k.classList.toggle('kb-pressed', pressed);
            if(pressed){
                rpc('keyboard_press', {key:key});
                togglePressedCount++;
                setStatus('已发送 keyboard_press ' + key);
            }else{
                if(togglePressedCount > 0) togglePressedCount--;
                rpc('keyboard_release', {key:key});
                setStatus('已发送 keyboard_release ' + key);
                captureDelayed(); // 松开切换键后延迟刷新画面
            }
        });
    });

    // ================== 配置页（任务 × 账号 勾选矩阵，对照 dialog.py） ==================

    const worksPage = document.getElementById('worksPage');
    const worksTable = document.getElementById('worksTable');
    const worksStatusEl = document.getElementById('worksStatus');
    const worksSaveBtn = document.getElementById('worksSaveBtn');
    let worksMeta = [];      // 服务端返回的 works，保留 tag / record_name / region
    let taskRows = [];       // 矩阵行：任务名
    let columns = [];        // 每列的勾选框引用
    let worksDirty = false;

    function setWorksStatus(text, isError){
        worksStatusEl.textContent = text || '';
        worksStatusEl.classList.toggle('error', !!isError);
    }

    function markWorksDirty(){
        worksDirty = true;
        setWorksStatus('有未保存的修改');
    }

    function createCheckbox(checked, onChange){
        const box = document.createElement('input');
        box.type = 'checkbox';
        box.checked = !!checked;
        box.addEventListener('change', onChange);
        return box;
    }

    // 任一任务勾选变化后，同步该账号的「全选」状态
    function syncAllState(colIndex){
        const column = columns[colIndex];
        const all = column.boxes.length > 0 && column.boxes.every((box)=> box.checked);
        if(column.allBox.checked !== all){
            column.block = true;
            column.allBox.checked = all;
            column.block = false;
        }
    }

    function renderMatrix(works, tasks){
        worksMeta = works.map((work)=> Object.assign({}, work, {tasks: (work.tasks || []).slice()}));
        taskRows = tasks;
        columns = [];
        worksTable.innerHTML = '';

        worksMeta.forEach(()=> {
            columns.push({boxes: [], allBox: null, enableBox: null, block: false});
        });

        // 表头：学科列 + 每个账号（tag 为主，record_name 辅助）
        const thead = document.createElement('thead');
        const headRow = document.createElement('tr');
        const corner = document.createElement('th');
        corner.className = 'task-col';
        corner.textContent = '任务';
        headRow.appendChild(corner);
        worksMeta.forEach((work)=>{
            const th = document.createElement('th');
            th.className = 'col-head';
            const tag = document.createElement('div');
            tag.className = 'tag';
            tag.textContent = work.tag || '(未命名)';
            const record = document.createElement('div');
            record.className = 'record';
            record.textContent = work.record_name || '';
            th.appendChild(tag);
            th.appendChild(record);
            headRow.appendChild(th);
        });
        thead.appendChild(headRow);
        worksTable.appendChild(thead);

        // 任务行
        const tbody = document.createElement('tbody');
        taskRows.forEach((task, rowIndex)=>{
            const tr = document.createElement('tr');
            const nameCell = document.createElement('td');
            nameCell.className = 'task-col';
            nameCell.textContent = task;
            tr.appendChild(nameCell);
            worksMeta.forEach((work, colIndex)=>{
                const td = document.createElement('td');
                const box = createCheckbox(work.tasks.indexOf(task) >= 0, ()=>{
                    syncAllState(colIndex);
                    markWorksDirty();
                });
                td.appendChild(box);
                tr.appendChild(td);
                columns[colIndex].boxes.push(box);
            });
            tbody.appendChild(tr);
        });

        // 全选行
        const allRow = document.createElement('tr');
        allRow.className = 'special';
        const allName = document.createElement('td');
        allName.className = 'task-col';
        allName.textContent = '全选';
        allRow.appendChild(allName);
        worksMeta.forEach((work, colIndex)=>{
            const td = document.createElement('td');
            const column = columns[colIndex];
            column.allBox = createCheckbox(
                column.boxes.length > 0 && column.boxes.every((box)=> box.checked),
                ()=>{
                    if(column.block){
                        column.block = false;
                        return;
                    }
                    column.boxes.forEach((box)=> { box.checked = column.allBox.checked; });
                    markWorksDirty();
                }
            );
            td.appendChild(column.allBox);
            allRow.appendChild(td);
        });
        tbody.appendChild(allRow);

        // 启用账号行
        const enableRow = document.createElement('tr');
        enableRow.className = 'special';
        const enableName = document.createElement('td');
        enableName.className = 'task-col';
        enableName.textContent = '启用账号';
        enableRow.appendChild(enableName);
        worksMeta.forEach((work, colIndex)=>{
            const td = document.createElement('td');
            const column = columns[colIndex];
            column.enableBox = createCheckbox(work.enable, markWorksDirty);
            td.appendChild(column.enableBox);
            enableRow.appendChild(td);
        });
        tbody.appendChild(enableRow);
        worksTable.appendChild(tbody);
    }

    async function loadWorks(){
        if(!authed){
            setWorksStatus('未连接，无法读取配置', true);
            return;
        }
        setWorksStatus('正在读取...');
        worksSaveBtn.disabled = true;
        try{
            const worksResult = await rpcAwait('load_works', {}, 5000);
            const works = (worksResult && worksResult.works) || [];
            let tasks = [];
            try{
                const tasksResult = await rpcAwait('load_tasks', {}, 5000);
                tasks = (tasksResult && tasksResult.tasks) || [];
            }catch(err){
                tasks = [];
            }
            // 任务目录取不到时退回各账号任务并集；再补上配置里独有的任务，避免保存时被丢掉
            if(!tasks.length){
                const seen = new Set();
                works.forEach((work)=> (work.tasks || []).forEach((name)=> seen.add(name)));
                tasks = Array.from(seen);
            }
            const known = new Set(tasks);
            works.forEach((work)=> (work.tasks || []).forEach((name)=>{
                if(!known.has(name)){
                    known.add(name);
                    tasks.push(name);
                }
            }));
            if(!works.length){
                worksMeta = [];
                columns = [];
                worksTable.innerHTML = '';
                setWorksStatus('服务端没有 works 配置', true);
                return;
            }
            renderMatrix(works, tasks);
            worksDirty = false;
            setWorksStatus('已读取 ' + works.length + ' 个账号 / ' + tasks.length + ' 个任务');
        }catch(err){
            setWorksStatus('❌ 读取失败: ' + err.message, true);
        }finally{
            worksSaveBtn.disabled = false;
        }
    }

    async function saveWorks(){
        if(!authed){
            setWorksStatus('未连接，无法保存', true);
            return;
        }
        if(!worksMeta.length){
            setWorksStatus('没有可保存的配置', true);
            return;
        }
        // tag / record_name / region 原样带回，只提交勾选结果
        const works = worksMeta.map((work, colIndex)=>{
            const column = columns[colIndex];
            return {
                enable: column.enableBox.checked,
                tag: work.tag,
                record_name: work.record_name,
                region: work.region || null,
                tasks: taskRows.filter((task, rowIndex)=> column.boxes[rowIndex].checked)
            };
        });
        worksSaveBtn.disabled = true;
        setWorksStatus('正在保存...');
        try{
            const result = await rpcAwait('save_works', {works: works}, 8000);
            const count = result && typeof result.count === 'number' ? result.count : works.length;
            worksDirty = false;
            setWorksStatus('✅ 已保存 ' + count + ' 个账号配置');
        }catch(err){
            setWorksStatus('❌ 保存失败: ' + err.message, true);
        }finally{
            worksSaveBtn.disabled = false;
        }
    }

    function openWorksPage(){
        if(!authed){ alert('未完成连接'); return; }
        worksPage.hidden = false;
        loadWorks();
    }

    function closeWorksPage(){
        if(worksDirty && !confirm('有未保存的修改，确定关闭吗？')){
            return;
        }
        worksPage.hidden = true;
        worksDirty = false;
    }

    worksBtn.addEventListener('click', openWorksPage);
    worksSaveBtn.addEventListener('click', saveWorks);
    document.getElementById('worksReloadBtn').addEventListener('click', ()=>{
        if(worksDirty && !confirm('重新读取会丢弃未保存的修改，继续吗？')){ return; }
        loadWorks();
    });
    document.getElementById('worksCloseBtn').addEventListener('click', closeWorksPage);

    connectBtn.addEventListener('click',()=>{
        if(ws){
            closeCapture();
            ws.close();
            return;
        }
        const parts = splitWs(wsUrlInput.value);
        if(!parts.host){
            alert('请填写 WebSocket 地址（u）');
            return;
        }
        if(!(parseInt(p1Input.value, 10) || parts.port)){
            alert('请填写主控端口 p1');
            return;
        }
        const url = commandUrl();
        authed = false;
        capAuthed = false;
        seq = 0;
        lastSeq = 0;
        screenW = 0;
        screenH = 0;
        ws = new WebSocket(url);
        ws.binaryType = "arraybuffer";

        connectBtn.textContent = '断开';
        connectBtn.classList.add('disconnect');
        setActionButtonsEnabled(false);
        setPointButtonsEnabled(false);

        ws.onopen = ()=>{
            setStatus('已连接，正在鉴权...');
            // 连接后必须先发鉴权消息
            ws.send(JSON.stringify({type:'auth', token: wsToken.value.trim()}));
            // 客户端鉴权超时兜底（服务端 5 秒超时断连）
            authTimer = setTimeout(()=>{
                if(!authed && ws){
                    setStatus('🔌 鉴权超时，正在断开');
                    ws.close();
                }
            }, 6000);
        };
        ws.onmessage = (evt)=>{
            if(evt.data instanceof ArrayBuffer){
                const f = decodeFrame(evt.data);
                if(f) handleServerMessage(f.head, f.payloads);
            }else{
                // 文本 JSON：auth_ok 或错误回执
                try{
                    const obj = JSON.parse(evt.data);
                    handleServerMessage(obj, []);
                }catch(e){
                    setStatus('收到消息：' + evt.data);
                }
            }
        };
        ws.onerror = (err)=>{
            setStatus('❌ 发生错误:' + err);
        };
        ws.onclose = (e)=>{
            clearTimeout(authTimer);
            authed = false;
            closeCapture(); // 主控断开时一并断开抓帧连接
            let msg;
            if(e.code === 4001){
                msg = '🔌 鉴权失败（token 不正确）';
            }else if(e.code === 1006){
                msg = '🔌 连接中断（服务器无响应 / 网络断开）';
            }else if(e.code === 1000){
                msg = '🔌 连接已正常关闭';
            }else if(e.reason){
                msg = `🔌 连接关闭 code:${e.code} reason:${e.reason}`;
            }else{
                msg = `🔌 连接关闭 code:${e.code}`;
            }
            setStatus(msg);
            ws = null;
            connectBtn.textContent = '连接';
            connectBtn.classList.remove('disconnect');
            setActionButtonsEnabled(false);
            setPointButtonsEnabled(false);
            if(!worksPage.hidden){
                setWorksStatus('连接已断开，无法保存', true);
                worksSaveBtn.disabled = true;
            }
            resetScreen();
        }
    });

    refreshBtn.addEventListener('click',()=>{
        sendCapture();
    });
</script>
